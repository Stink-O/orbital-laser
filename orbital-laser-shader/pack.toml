[pack]
name = "Orbital Laser"
description = "A terrestrial orbital laser strike, in two lasers: Plasma (a raging beam, forked lightning, a fireball) and Godly (the clouds part, a pillar of light, halos, wings, a sigil)."
authors = ["Stink-O"]
version = "0.1.0"
license = "MIT"
api = 1

[[stage]]
kind = "composite"
shader = "shaders/strike.wgsl"

[options.target_x]
label = "Target X"
default = 0.0
min = -30000000.0
max = 30000000.0
step = 1.0

[options.target_y]
label = "Target Y"
default = 64.0
min = -64.0
max = 320.0
step = 1.0

[options.target_z]
label = "Target Z"
default = 0.0
min = -30000000.0
max = 30000000.0
step = 1.0

[options.intensity]
label = "Intensity"
default = 1.0
min = 0.2
max = 2.0
step = 0.1

[options.freeze_time]
label = "Strike clock (set by strike.py: -1 running, 100 idle)"
default = 100.0
min = -1.0
max = 200.0
step = 0.1

[options.swz]
label = "Debug: capture modes (leave at 0)"
default = 0.0
min = 0.0
max = 3.0
step = 1.0

[options.seed]
label = "Randomness seed (set by strike.py)"
default = 0.0
min = 0.0
max = 1000.0
step = 1.0

[options.theme]
label = "Laser (0 Plasma, 1 Godly; set by strike.py)"
default = 0.0
min = 0.0
max = 1.0
step = 1.0

[options.anchor_x]
label = "Hit block centre X (set by strike.py)"
default = 0.5
min = -30000000.0
max = 30000000.0
step = 0.5

[options.anchor_z]
label = "Hit block centre Z (set by strike.py)"
default = 0.5
min = -30000000.0
max = 30000000.0
step = 0.5

[options.wing_a]
label = "Godly: the wings' facing, radians (set by strike.py)"
default = 0.0
min = -3.2
max = 3.2
step = 0.01
