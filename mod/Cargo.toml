[package]
name = "orbital-laser"
version = "0.5.1"
edition = "2024"
description = "Orbital Laser: a Horizon mod. Call down an orbital strike that drills a crater to bedrock."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Horizon's stock mod SDK (command.run-quiet arrives in ludovic111/horizon#2140 and the PR after it).
horizon-mod-sdk = { git = "https://github.com/ludovic111/horizon", branch = "feat/mod-run-quiet" }

[profile.release]
opt-level = "s"
lto = true
