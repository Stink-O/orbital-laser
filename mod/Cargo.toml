[package]
name = "orbital-laser"
version = "0.5.1"
edition = "2024"
description = "Orbital Laser: a Horizon mod. Call down an orbital strike that drills a crater to bedrock."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Horizon's stock mod SDK (command.run-quiet: API level 3, in the first Horizon release after 0.2.73).
horizon-mod-sdk = { git = "https://github.com/ludovic111/horizon", branch = "main" }

[profile.release]
opt-level = "s"
lto = true
