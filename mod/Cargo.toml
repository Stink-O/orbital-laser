[package]
name = "orbital-laser"
version = "0.3.0"
edition = "2024"
description = "Orbital Laser: a Horizon mod. Call down an orbital strike that drills a crater to bedrock."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The Horizon mod SDK with the input, ui, render and world interfaces
# (Stink-O/horizon, branch mod-api-input-ui-render-world).
horizon-mod-sdk = { path = "../../../horizon-src/crates/horizon-mod-sdk" }

[profile.release]
opt-level = "s"
lto = true
