target = "horizon_client_lib::motion::MotionWorld<'_,'_,'_>::controlled_simulation_tick_with_sprint_window"
kind = "HEAD"
cancellable = true
helper = "carry_tick.rs"
bindings = [
  { name = "world", ty = "&mut crate::motion::MotionWorld<'_, '_, '_>", value = "&mut *self" },
  { name = "keys", ty = "crate::sprint::Keys", value = "keys" },
]

