[mod]
id = "orbital"
version = "0.5.10"
priority = 100

[compatibility]
horizon_revision = "e57b1d34bb0dcf6bf081c19fe6d2e7f69b60cdf4"

# The mod's code, unchanged, on a native build of its SDK (engine/src/horizon_sdk.rs).
[[crate]]
id = "engine"
path = "engine"

# The fork's mod host (game/mods.rs) driving it through Horizon's hooks and helpers: the client half and the server
# half (glue.rs).
[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "orbital_glue"
source = "glue.rs"

# The fork's post pass (gfx/mod_post.rs and its prelude), drawn on the renderer's hook points (post.rs).
[[module]]
id = "post"
file = "crates/horizon-client-render/src/lib.rs"
name = "orbital_post"
source = "post.rs"
visibility = "pub"

# The fork's `world.carry-player` (carry.rs), beside the local player's motion in the client library.
[[module]]
id = "carry"
file = "crates/horizon-client/src/client_lib.rs"
name = "orbital_carry"
source = "carry.rs"
visibility = "pub"

[[injection]]
